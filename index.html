<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SightsOnMap.com – Permanently Closed</title>
  <meta name="description" content="SightsOnMap.com is permanently closed due to the loss of cruise data support.">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      color: #e8f1ff;
      background: linear-gradient(180deg, #0b2447 0%, #19376d 55%, #576cbc 100%);
      overflow: hidden;
      position: relative;
    }

    /* Decorative waves */
    .waves {
      position: fixed;
      left: 0;
      bottom: 0;
      width: 100%;
      height: 180px;
      z-index: 0;
      opacity: 0.35;
    }

    .card {
      position: relative;
      z-index: 1;
      max-width: 620px;
      width: 100%;
      padding: 56px 40px;
      text-align: center;
      background: rgba(255, 255, 255, 0.08);
      border: 1px solid rgba(255, 255, 255, 0.18);
      border-radius: 24px;
      backdrop-filter: blur(14px);
      -webkit-backdrop-filter: blur(14px);
      box-shadow: 0 20px 60px rgba(0, 0, 0, 0.35);
      animation: fadeUp 0.9s ease both;
    }

    .icon {
      font-size: 64px;
      margin-bottom: 16px;
      display: inline-block;
      animation: float 4s ease-in-out infinite;
    }

    .badge {
      display: inline-block;
      margin-bottom: 20px;
      padding: 6px 16px;
      font-size: 0.8rem;
      font-weight: 600;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: #ffd6d6;
      background: rgba(255, 90, 90, 0.2);
      border: 1px solid rgba(255, 120, 120, 0.5);
      border-radius: 999px;
    }

    h1 {
      font-size: clamp(1.9rem, 5vw, 2.6rem);
      margin-bottom: 20px;
      line-height: 1.2;
    }

    h1 span { color: #ffd166; }

    p {
      font-size: 1.1rem;
      line-height: 1.7;
      color: #d4e2ff;
    }

    .divider {
      width: 60px;
      height: 3px;
      margin: 28px auto;
      border-radius: 2px;
      background: linear-gradient(90deg, #ffd166, #ef476f);
    }

    .apology {
      font-style: italic;
      color: #ffffff;
    }

    footer {
      margin-top: 32px;
      font-size: 0.85rem;
      color: rgba(255, 255, 255, 0.55);
    }

    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(24px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    @keyframes float {
      0%, 100% { transform: translateY(0); }
      50%      { transform: translateY(-10px); }
    }

    @media (max-width: 480px) {
      .card { padding: 40px 24px; }
    }
  </style>
</head>
<body>
  <svg class="waves" viewBox="0 0 1440 320" preserveAspectRatio="none" aria-hidden="true">
    <path fill="#ffffff" fill-opacity="0.4"
      d="M0,224L60,208C120,192,240,160,360,165.3C480,171,600,213,720,218.7C840,224,960,192,1080,170.7C1200,149,1320,139,1380,133.3L1440,128L1440,320L0,320Z"></path>
  </svg>

  <main class="card">
    <div class="icon" aria-hidden="true">🚢</div>
    <div class="badge">Permanently Closed</div>
    <h1><span>SightsOnMap.com</span> has closed</h1>
    <p>
      SightsOnMap.com is permanently closed due to the loss of cruise data support.
    </p>
    <div class="divider"></div>
    <p class="apology">We sincerely apologize for the inconvenience.</p>
    <footer>Thank you for being part of the journey.</footer>
  </main>
</body>
</html>
